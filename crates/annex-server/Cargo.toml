[package]
name = "annex-server"
version = "0.1.0"
edition = "2024"
description = "Reference HTTP servers on top of annex-core (dense single-vector) and annex-multivector (late-interaction)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rosharma719/annex"

[[bin]]
name = "dense-server"
path = "src/bin/dense_server.rs"

[dependencies]
annex-core = { path = "../annex-core" }
axum = "0.8"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
