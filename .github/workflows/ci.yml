name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Exercise x86_64 and aarch64 kernel dispatch.
  check:
    name: Build & test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # Pre-existing warnings are tracked but not yet gating; this catches
        # newly introduced clippy errors and default-deny lints.
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: Benchmark and HTTP integration tests
        env:
          ANNEX_TEST_BINARY: target/debug/annex-multivector
        run: |
          python -m pip install 'numpy>=2,<3'
          cargo build -p annex-multivector --bin annex-multivector
          python -m unittest discover -s crates/annex-multivector/benchmark -p 'test_*.py'

      - name: Python wheel and native search integration tests
        run: |
          python -m pip install 'maturin>=1.8,<2'
          cargo run -p annex-py --example make_test_fixture -- "$RUNNER_TEMP/annex-fixture.bin"
          maturin build --manifest-path python/annex-py/Cargo.toml --release --compatibility linux
          python -m pip install target/wheels/annex_py-*.whl
          ANNEX_TEST_SNAPSHOT="$RUNNER_TEMP/annex-fixture.bin" python -m unittest discover -s python/annex-py/tests -v
          VECTORDB_EXACT_FALLBACK_ENABLED=false ANNEX_TEST_SNAPSHOT="$RUNNER_TEMP/annex-fixture.bin" python -m unittest discover -s python/annex-py/tests -v

      - name: doc
        run: cargo doc --workspace --no-deps

  # Compile-only check on the criterion benches so a broken bench file
  # doesn't slip in unnoticed. Actual perf runs happen locally / on
  # dedicated hardware — GitHub runners aren't stable enough for
  # microsecond-scale timing.
  bench-compile:
    name: Bench compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run
