[package]
name = "annex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "ANNex: in-memory ANN (HNSW) vector search engine with payload filtering, snapshot persistence, and WAL replay."
repository = "https://github.com/rosharma719/annex"
documentation = "https://docs.rs/annex"
readme = "README.md"
keywords = ["hnsw", "vector-search", "ann", "similarity", "embeddings"]
categories = ["database-implementations", "algorithms", "data-structures"]
exclude = [
    "data/*",
    "logs/*",
    "docs/nyt_snapshot_builds.json",
    "scripts/*",
    "tests/*",
    "examples/*",
    ".env.example",
    ".claude/*",
]

[dependencies]
thiserror = "1.0"
parking_lot = "0.12"
anyhow = "1.0"
ordered-float = { version = "4.1", features = ["serde"] }
rand = { version = "0.9.0", features = ["std", "small_rng"] }
itertools = "0.14.0"
ndarray = { version = "0.15", features = ["std"] }
ndarray-npy = "0.8"
serde_json = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = "thin"
