[package]
name = "annex-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Python bindings for the ANNex vector search engine."

[lib]
name = "annex_py"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
annex = { package = "annex-core", path = "../../crates/annex-core" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"

