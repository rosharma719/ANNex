[package]
name = "annex-py"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Python bindings for the ANNex vector search engine."

[lib]
name = "annexdb"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
annex = { path = "../../crates/annex-core", version = "0.3.0" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"
