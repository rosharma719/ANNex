[package]
name = "annex-multivector"
version = "0.1.0"
default-run = "annex-multivector"
edition = "2024"
description = "Late-interaction retrieval built on annex-core: MUVERA fixed-dimensional candidate generation, packed 2-bit residuals, ColBERT MaxSim rescoring."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rosharma719/annex"

[lib]
name = "multivector"

[[bin]]
name = "annex-multivector"
path = "src/main.rs"

[[bin]]
name = "maxsim-bench"
path = "src/bin/maxsim_bench.rs"

[dependencies]
annex-core = { path = "../annex-core" }
axum = "0.8"
blake3 = "1.8"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rayon = "1.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
