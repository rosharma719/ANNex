[package]
name = "annex-server"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Reference HTTP servers on top of annex (dense single-vector) and annex-multivector (late-interaction)."
license = "MIT OR Apache-2.0"
homepage = "https://annexsearch.vercel.app"
repository = "https://github.com/rosharma719/annex"

[[bin]]
name = "annex-server"
path = "src/bin/annex_server.rs"

[dependencies]
annex = { path = "../annex-core", version = "0.3.0" }
axum = "0.8"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
