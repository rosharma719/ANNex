[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annex"
version = "0.3.0"
description = "Python client for the ANNex vector search service."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["vector-search", "ann", "rag", "embeddings", "retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rosharma719/ANNex"
Repository = "https://github.com/rosharma719/ANNex"

[tool.hatch.build.targets.wheel]
packages = ["annex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
