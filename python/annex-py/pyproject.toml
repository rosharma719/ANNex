[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "ANNexDB"
version = "0.2.0"
requires-python = ">=3.9"
description = "Python bindings for the ANNex vector search engine."
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.23"]

[tool.maturin]
features = ["extension-module"]

