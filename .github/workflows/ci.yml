name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cross-platform build/test. macos-14 runners are Apple Silicon (aarch64),
  # so this is the only path that actually exercises the NEON kernels in
  # annex-multivector — Linux ubuntu-latest runners are x86_64 and take
  # the scalar fallback path.
  check:
    name: Build & test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Benchmark protocol tests
        run: python3 -m unittest discover -s crates/annex-multivector/benchmark -p 'test_protocol*.py'

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # Pre-existing warnings are tracked but not yet gating; this catches
        # newly introduced clippy errors and default-deny lints.
        run: cargo clippy --workspace --all-targets

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace --all-targets

      - name: doc
        run: cargo doc --workspace --no-deps

  # Compile-only check on the criterion benches so a broken bench file
  # doesn't slip in unnoticed. Actual perf runs happen locally / on
  # dedicated hardware — GitHub runners aren't stable enough for
  # microsecond-scale timing.
  bench-compile:
    name: Bench compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run
